name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy --explicit-package-bases app scripts
      - run: python -m pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80
      - name: Reject committed secrets
        run: >-
          detect-secrets-hook
          --exclude-files '^tests/'
          --exclude-lines 'REPLACE_|placeholder|example\.com|db_key\s*='
          $(git ls-files)
